<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二手电子设备质检回收系统</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">DR</div>
          <div>
            <h1>质检回收</h1>
            <p>二手电子设备</p>
          </div>
        </div>

        <nav class="status-tabs" id="statusTabs">
          <button class="active" data-status="all">全部</button>
          <button data-status="received">待质检</button>
          <button data-status="quoted">待确认</button>
          <button data-status="recycled">已回收</button>
          <button data-status="listed">已上架</button>
          <button data-status="rejected">已拒绝</button>
        </nav>

        <section class="quick-entry">
          <h2>设备登记</h2>
          <form id="createForm">
            <label>
              品类
              <select name="category" required>
                <option value="phone">手机</option>
                <option value="laptop">笔记本</option>
                <option value="camera">相机</option>
                <option value="console">游戏机</option>
                <option value="tablet">平板</option>
                <option value="headphone">耳机</option>
              </select>
            </label>
            <div class="two-cols">
              <label>
                品牌
                <input name="brand" required placeholder="Apple" />
              </label>
              <label>
                型号
                <input name="model" required placeholder="iPhone 15" />
              </label>
            </div>
            <label>
              序列号
              <input name="serialNumber" required placeholder="SN 或 IMEI" />
            </label>
            <div class="two-cols">
              <label>
                来源
                <input name="sourceChannel" required placeholder="门店/闲鱼/企业" />
              </label>
              <label>
                预期价
                <input name="expectedPrice" type="number" min="0" placeholder="3000" />
              </label>
            </div>
            <div class="two-cols">
              <label>
                客户
                <input name="ownerName" required placeholder="姓名" />
              </label>
              <label>
                电话
                <input name="ownerPhone" required placeholder="手机号" />
              </label>
            </div>
            <label>
              随机配件
              <input name="accessories" placeholder="包装盒，充电器" />
            </label>
            <label>
              初始描述
              <textarea name="issueDescription" rows="3" placeholder="客户描述的问题"></textarea>
            </label>
            <button class="primary-btn" type="submit">登记设备</button>
          </form>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h2>回收工作台</h2>
            <p id="todayText"></p>
          </div>
          <div class="search-box">
            <input id="keywordInput" placeholder="搜索编号、型号、客户或序列号" />
            <button id="refreshBtn">刷新</button>
          </div>
        </header>

        <section class="metrics" id="metrics"></section>

        <section class="content-grid">
          <section class="list-panel">
            <div class="panel-title">
              <h3>设备队列</h3>
              <span id="listCount">0 台</span>
            </div>
            <div class="filter-bar">
              <div class="filter-row">
                <label>
                  品类
                  <select id="categoryFilter">
                    <option value="all">全部品类</option>
                    <option value="phone">手机</option>
                    <option value="laptop">笔记本</option>
                    <option value="camera">相机</option>
                    <option value="console">游戏机</option>
                    <option value="tablet">平板</option>
                    <option value="headphone">耳机</option>
                  </select>
                </label>
                <label>
                  最低报价
                  <input id="minPriceFilter" type="number" min="0" placeholder="不限" />
                </label>
                <label>
                  最高报价
                  <input id="maxPriceFilter" type="number" min="0" placeholder="不限" />
                </label>
              </div>
              <div class="filter-row">
                <label>
                  更新时间
                  <select id="dateRangeFilter">
                    <option value="all">全部时间</option>
                    <option value="today">今天</option>
                    <option value="week">近7天</option>
                    <option value="month">近30天</option>
                  </select>
                </label>
                <label class="checkbox-label">
                  <input id="riskFilter" type="checkbox" />
                  仅显示有风险标记
                </label>
                <label>
                  排序
                  <select id="sortByFilter">
                    <option value="updatedAt">更新时间</option>
                    <option value="createdAt">登记时间</option>
                    <option value="quotePrice">报价金额</option>
                  </select>
                </label>
                <label>
                  顺序
                  <select id="sortOrderFilter">
                    <option value="desc">降序</option>
                    <option value="asc">升序</option>
                  </select>
                </label>
              </div>
              <div class="filter-actions">
                <button id="resetFiltersBtn" class="plain-btn">重置筛选</button>
              </div>
            </div>
            <div class="device-list" id="deviceList"></div>
          </section>

          <section class="detail-panel" id="detailPanel">
            <div class="empty-state">
              <h3>选择一台设备</h3>
              <p>查看质检、报价、客户确认和入库信息。</p>
            </div>
          </section>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="./app.js"></script>
  </body>
</html>
